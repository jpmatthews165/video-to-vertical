<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D6AFE"/>
      <stop offset="1" stop-color="#B14CF2"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D6AFE"/>
      <stop offset="1" stop-color="#A24EF0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A0A5E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-style squircle tile (824px on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- the original horizontal frame -->
  <rect x="214" y="352" width="596" height="336" rx="40" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="22"/>

  <!-- the vertical clip -->
  <g filter="url(#shadow)">
    <rect x="392" y="236" width="240" height="552" rx="44" fill="#FFFFFF"/>
  </g>

  <!-- speaker -->
  <circle cx="512" cy="470" r="52" fill="url(#ink)"/>
  <path d="M422 640c0-56 40-96 90-96s90 40 90 96v18H422z" fill="url(#ink)"/>

  <!-- tracking brackets around the speaker -->
  <g fill="none" stroke="url(#ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M440 412v-24h24"/>
    <path d="M584 412v-24h-24"/>
    <path d="M440 696v24h24"/>
    <path d="M584 696v24h-24"/>
  </g>
</svg>
